<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff6ea">
<title>Feliz Cumpleaños, Cuñadito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crema: #fff6ea; --durazno: #ffd9b3; --naranja: #f2771a; --naranja2: #ff9f43;
    --cafe: #4a2611; --verde: #2a9d8f; --oro: #e9b44c; --blanco: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.8), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(42,157,143,.16), transparent 45%),
      linear-gradient(170deg, var(--crema), var(--durazno) 60%, #ffb27a);
  }
  body {
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--crema); color: var(--cafe); text-align: center; overflow-x: hidden;
    font-variant-numeric: lining-nums; min-height: 100dvh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* Sobre de inicio: solo aparece si el navegador bloquea la música automática */
  #inicio {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px; padding: 24px;
    background: linear-gradient(170deg, var(--crema), var(--durazno));
    transition: opacity .7s, transform .7s;
  }
  #inicio.visible { display: flex; }
  #inicio.oculto { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .sobre {
    width: 200px; height: 130px; position: relative; border-radius: 10px;
    background: var(--blanco); box-shadow: 0 18px 40px rgba(74,38,17,.2);
    animation: flotar 3s ease-in-out infinite; --giro: 0deg;
  }
  .sobre::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 70px;
    background: var(--durazno); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 10px 10px 0 0;
  }
  .sello {
    position: absolute; left: 50%; top: 52px; width: 38px; height: 38px; margin-left: -19px;
    border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--naranja2), var(--naranja));
    box-shadow: 0 3px 8px rgba(242,119,26,.5);
  }
  #inicio h2 { font-family: "Playfair Display", serif; font-size: clamp(22px, 6.5vw, 30px); letter-spacing: .04em; line-height: 1.25; }
  .boton {
    border: 0; border-radius: 999px; padding: 16px 36px; font: 600 17px "Poppins", sans-serif;
    color: var(--blanco); background: linear-gradient(135deg, var(--naranja2), var(--naranja));
    box-shadow: 0 8px 22px rgba(242,119,26,.45); animation: pulso 1.8s infinite;
  }
  .boton:active { transform: scale(.96); }

  main { max-width: 480px; margin: 0 auto; padding: 44px 0 110px; position: relative; z-index: 1; }
  .entra { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform .9s ease; }
  .entra.ver { opacity: 1; transform: none; }

  .pre { font-size: 13px; letter-spacing: .35em; text-transform: uppercase; color: var(--verde); font-weight: 600; }
  h1 {
    font-family: "Playfair Display", Georgia, serif; font-weight: 900;
    font-size: clamp(42px, 13vw, 68px); line-height: 1.02; margin: 10px 0 18px;
    color: var(--naranja); text-shadow: 0 3px 0 var(--blanco), 0 8px 18px rgba(242,119,26,.3);
  }
  .palabra { display: inline-block; white-space: nowrap; }
  .letra { display: inline-block; animation: ola 2s ease-in-out infinite; }
  .carino { font-family: "Playfair Display", serif; font-style: italic; font-size: clamp(24px, 7vw, 32px); }
  .mejor {
    display: inline-block; margin: 14px 0 34px; padding: 8px 20px; border-radius: 999px;
    background: var(--verde); color: var(--blanco); font-weight: 600; font-size: 16px; letter-spacing: .03em;
    box-shadow: 0 6px 16px rgba(42,157,143,.35);
  }

  /* Fotos estilo polaroid: el fondo blanco se funde con el GIF */
  .polaroid {
    background: var(--blanco); border-radius: 18px; padding: 12px 12px 16px;
    margin: 0 auto 30px; width: min(100%, 340px);
    box-shadow: 0 16px 34px rgba(74,38,17,.18), 0 2px 6px rgba(74,38,17,.08);
    transform: rotate(var(--giro)); animation: flotar 4.5s ease-in-out infinite;
  }
  .polaroid img { width: 100%; display: block; border-radius: 12px; object-fit: cover; }
  .foto { --giro: -2.5deg; }
  .foto img { aspect-ratio: 4 / 5; object-position: center 35%; }
  .gif { --giro: 2.5deg; animation-delay: -2.2s; }
  .gif img { aspect-ratio: 1 / 1; object-fit: contain; }
  .polaroid p { padding-top: 12px; font-family: "Playfair Display", serif; font-style: italic; font-size: 18px; }

  .mensaje {
    position: relative; padding: 30px 22px 26px; margin: 8px 0 24px; border-radius: 22px;
    background: rgba(255,255,255,.7); box-shadow: 0 10px 30px rgba(74,38,17,.1);
  }
  .mensaje p { font-size: 17px; line-height: 1.7; }
  .mensaje .grande { font-family: "Playfair Display", serif; font-weight: 900; font-size: clamp(22px, 6.8vw, 30px); line-height: 1.3; letter-spacing: .03em; color: var(--cafe); }
  .rango { display: flex; justify-content: center; gap: 12px; margin-top: 18px; }
  .rango div { flex: 1; max-width: 170px; padding: 12px 8px; border-radius: 14px; background: var(--crema); }
  .rango small { display: block; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--verde); font-weight: 600; }
  .rango b { font-family: "Playfair Display", serif; font-size: clamp(22px, 6.5vw, 28px); color: var(--naranja); }
  .firma { font-family: "Playfair Display", serif; font-style: italic; font-size: clamp(22px, 6.5vw, 28px); line-height: 1.35; color: var(--naranja); margin-top: 8px; }

  #musica {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6;
    width: 54px; height: 54px; border-radius: 50%; border: 0;
    background: var(--blanco); box-shadow: 0 6px 18px rgba(74,38,17,.25);
    display: grid; place-items: center;
  }
  #musica span { display: block; width: 4px; height: 18px; margin: 0 1.5px; border-radius: 2px; background: var(--naranja); animation: barra .9s ease-in-out infinite; }
  #musica span:nth-child(2) { animation-delay: -.3s; } #musica span:nth-child(3) { animation-delay: -.6s; }
  #musica div { display: flex; align-items: center; }
  #musica.off span { animation: none; height: 6px; background: #c9a98f; }


  /* Mini juego de fútbol */
  .juego { margin: 0 0 30px; }
  .juego h3 { font-family: "Playfair Display", serif; font-size: clamp(22px, 6.5vw, 28px); margin-bottom: 4px; }
  .juego .marcador { font-size: 14px; color: var(--verde); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 12px; }
  .cancha {
    position: relative; height: 380px; border-radius: 22px; overflow: hidden; touch-action: none;
    background: repeating-linear-gradient(180deg, #4caf50 0 38px, #43a047 38px 76px);
    box-shadow: 0 14px 30px rgba(74,38,17,.2), inset 0 0 0 3px rgba(255,255,255,.5);
    -webkit-user-select: none; user-select: none;
  }
  .cancha::after { /* área */
    content: ""; position: absolute; left: 12%; right: 12%; top: 0; height: 150px;
    border: 3px solid rgba(255,255,255,.7); border-top: 0;
  }
  .porteria {
    position: absolute; left: 20%; right: 20%; top: 18px; height: 84px; z-index: 1;
    border: 6px solid #fff; border-bottom: 0; border-radius: 4px 4px 0 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.45) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.45) 0 1px, transparent 1px 10px), rgba(0,0,0,.12);
  }
  .porteria.red { animation: red .5s ease; }
  .portero {
    position: absolute; top: 50px; left: 50%; width: 46px; height: 52px; margin-left: -23px; z-index: 2;
    animation: portero 2.4s ease-in-out infinite alternate;
  }
  .portero::before { /* cabeza */
    content: ""; position: absolute; left: 13px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: #f1c27d;
  }
  .portero::after { /* cuerpo y brazos */
    content: ""; position: absolute; left: 0; top: 18px; width: 46px; height: 30px; border-radius: 12px 12px 6px 6px;
    background: linear-gradient(90deg, var(--naranja) 0 20%, #333 20% 80%, var(--naranja) 80%);
  }
  .balon {
    position: absolute; left: 0; top: 0; width: 54px; height: 54px; z-index: 3;
    cursor: grab; will-change: transform; touch-action: none;
  }
  .sombra {
    position: absolute; left: 0; top: 0; width: 50px; height: 14px; z-index: 2; border-radius: 50%;
    background: radial-gradient(rgba(0,0,0,.4), transparent 70%); will-change: transform, opacity;
  }
  .aviso {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 4; pointer-events: none;
    font-family: "Playfair Display", serif; font-weight: 900; font-size: clamp(44px, 15vw, 72px);
    color: #fff; text-shadow: 0 4px 0 var(--naranja), 0 10px 24px rgba(0,0,0,.35);
    opacity: 0; transform: scale(.4);
  }
  .aviso.ver { animation: aviso 1.4s ease forwards; }
  .pista { position: absolute; bottom: 8px; left: 0; right: 0; font-size: 13px; color: rgba(255,255,255,.9); z-index: 1; }
  @keyframes portero { from { transform: translateX(-70px); } to { transform: translateX(70px); } }
  @keyframes red { 40% { transform: scaleY(1.08) translateY(-4px); } }
  @keyframes aviso { 15% { opacity: 1; transform: scale(1.1); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1); } }
  @keyframes flotar { 50% { transform: rotate(var(--giro)) translateY(-8px); } }
  @keyframes ola { 50% { transform: translateY(-5px); color: var(--oro); } }
  @keyframes pulso { 50% { box-shadow: 0 8px 30px rgba(242,119,26,.75); } }
  @keyframes barra { 50% { height: 6px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div id="inicio">
  <div class="sobre"><div class="sello"></div></div>
  <h2>PARA MI CUÑADITO FAVORITO</h2>
  <button class="boton" id="abrir">Abrir</button>
</div>

<canvas id="fx"></canvas>

<main>
  <p class="pre entra">Hoy es tu día</p>
  <h1 id="titulo" class="entra">¡Feliz Cumpleaños!</h1>
  <p class="carino entra">Te quiero mucho, cuñadito</p>
  <span class="mejor entra">El mejor cuñado del mundo</span>

  <div class="polaroid foto entra">
    <img src="img/gatito.jpg" alt="Gatito lindo">
    <p>Este gatito también te felicita</p>
  </div>

  <div class="polaroid gif entra">
    <img src="gif/cumple.gif" alt="Gatito bailando">
    <p>Que cumplas 500 años más</p>
  </div>

  <div class="juego entra">
    <div class="cancha" id="cancha">
      <div class="porteria" id="porteria"></div>
      <div class="portero" id="portero"></div>
      <div class="sombra" id="sombra"></div>
      <svg class="balon" id="balon" viewBox="0 0 100 100" aria-label="Balón">
        <circle cx="50" cy="50" r="47" fill="#fff" stroke="#222" stroke-width="3"/>
        <polygon points="50,32 67,44 61,64 39,64 33,44" fill="#222"/>
        <path d="M50 3v29M67 44l28-9M61 64l17 24M39 64L22 88M33 44L5 35" stroke="#222" stroke-width="3"/>
        <polygon points="50,3 38,6 50,14 62,6" fill="#222"/>
        <polygon points="95,35 92,22 86,40" fill="#222"/>
        <polygon points="5,35 8,22 14,40" fill="#222"/>
        <polygon points="78,88 88,78 72,80" fill="#222"/>
        <polygon points="22,88 12,78 28,80" fill="#222"/>
      </svg>
      <div class="aviso" id="aviso"></div>
    </div>
  </div>

  <div class="mensaje entra">
    <p class="grande">ERES EL MEJOR,<br>CUÍDATE MUCHO CUÑADITO</p>
  </div>
  <p class="firma entra">Feliz cumpleaños, cuñadito.<br>Eres el mejor cuñado del mundo.</p>
</main>

<button id="musica" class="off" aria-label="Música"><div><span></span><span></span><span></span></div></button>

<script>
// Título con letras en ola (sin cortar palabras)
const t = document.getElementById('titulo'); let li = 0;
t.innerHTML = t.textContent.split(' ').map(w => '<span class="palabra">' + [...w].map(c =>
  `<span class="letra" style="animation-delay:${li++ * 0.09}s">${c}</span>`).join('') + '</span>').join(' ');

// Aparición al hacer scroll + contador de años
const fmt = n => n.toLocaleString('es-MX');
function contar(el) {
  const fin = +el.dataset.fin, ini = performance.now(), dur = 2200;
  (function paso(ahora) {
    const k = Math.min((ahora - ini) / dur, 1), e = 1 - Math.pow(1 - k, 4);
    el.textContent = fmt(Math.round(fin * e));
    if (k < 1) requestAnimationFrame(paso);
  })(ini);
}
const obs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('ver'); obs.unobserve(e.target);
  e.target.querySelectorAll('.num').forEach(contar);
}), { threshold: .2 });
function mostrar() { document.querySelectorAll('.entra').forEach((el, i) => { el.style.transitionDelay = (i < 4 ? i * .15 : 0) + 's'; obs.observe(el); }); }

// ---------- Confeti, destellos y fuegos artificiales ----------
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H; const dpr = Math.min(window.devicePixelRatio || 1, 2);
function ajustar() { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
ajustar(); addEventListener('resize', ajustar);

const colores = ['#f2771a', '#ff9f43', '#2a9d8f', '#e9b44c', '#ffffff', '#e76f51'];
const parts = []; const rnd = (a, b) => a + Math.random() * (b - a);

function confeti(n) {
  for (let i = 0; i < n; i++) parts.push({ tipo: 'c', x: rnd(0, W), y: rnd(-H, 0), vx: rnd(-.6, .6), vy: rnd(1.5, 3),
    r: rnd(0, 6.28), vr: rnd(-.12, .12), w: rnd(6, 9), h: rnd(10, 14), c: colores[i % colores.length] });
}
function destellos(n) {
  for (let i = 0; i < n; i++) parts.push({ tipo: 'd', x: rnd(0, W), y: rnd(0, H), f: rnd(0, 6.28), s: rnd(1.5, 3) });
}
function fuego(x, y) {
  const c = colores[Math.floor(rnd(0, colores.length))];
  for (let i = 0; i < 60; i++) {
    const a = rnd(0, 6.28), v = rnd(1, 5.5);
    parts.push({ tipo: 'f', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c, vida: 70 });
  }
}
function estrella(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .35 : s * 2.2, a = i * Math.PI / 4; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.fill();
}
function loop() {
  ctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.tipo === 'c') {
      p.x += p.vx + Math.sin(p.y / 50) * .6; p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) { p.y = -20; p.x = rnd(0, W); }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.r * 2)); ctx.restore();
    } else if (p.tipo === 'd') {
      p.f += .04; ctx.globalAlpha = Math.max(0, Math.sin(p.f)) * .9; ctx.fillStyle = '#e9b44c';
      estrella(p.x, p.y, p.s); if (p.f > 6.28) { p.f = 0; p.x = rnd(0, W); p.y = rnd(0, H); }
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .98; p.vida--;
      if (p.vida <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = p.vida / 70; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(loop);
}
loop();
addEventListener('pointerdown', e => { if (!e.target.closest('button, .cancha')) fuego(e.clientX, e.clientY); });

// ---------- Música: "Cumpleaños feliz" ----------
// Se genera una sola vez como archivo de audio (WAV) y se reproduce con <audio>:
// en iPhone suena aunque el interruptor de silencio esté activado y sin chasquidos.
const f = n => 440 * Math.pow(2, (n - 69) / 12); // número MIDI -> Hz
const melodia = [[67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],[67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
  [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],[77,.75],[77,.25],[76,1],[72,1],[74,1],[72,3]];
const acordes = [[48,52,55],[43,50,53],[43,50,53],[48,52,55],[48,52,55],[41,48,53],[48,52,55],[43,50,53],[48,52,55]];
const BEAT = .52, SR = 32000;

function wav(buf) {
  const d = buf.getChannelData(0); let pico = 0;
  for (let i = 0; i < d.length; i++) pico = Math.max(pico, Math.abs(d[i]));
  const k = pico ? .8 / pico : 1, n = d.length, v = new DataView(new ArrayBuffer(44 + n * 2));
  const txt = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  txt(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); txt(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); txt(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, d[i] * k)) * 32767, true);
  return new Blob([v], { type: 'audio/wav' });
}
function generarCancion() {
  const total = melodia.reduce((a, [, d]) => a + d, 0) * BEAT + 2;
  const Off = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new Off(1, Math.ceil(total * SR), SR);
  const mezcla = oc.createGain(); mezcla.gain.value = .9; mezcla.connect(oc.destination);
  // Eco suave y limpio (sin ruido)
  const eco = oc.createDelay(); eco.delayTime.value = .18;
  const fb = oc.createGain(); fb.gain.value = .22; const filtro = oc.createBiquadFilter(); filtro.frequency.value = 2500;
  mezcla.connect(eco); eco.connect(filtro).connect(fb).connect(eco); fb.connect(oc.destination);
  // Nota tipo piano suave: fundamental + armónicos leves, ataque y caída sin clics
  function nota(n, ini, dur, vol) {
    [[1, 1], [2, .25], [3, .08]].forEach(([h, a]) => {
      const o = oc.createOscillator(), g = oc.createGain();
      o.type = 'sine'; o.frequency.value = f(n) * h;
      const fin = ini + Math.min(Math.max(dur * 1.4, .5), 2.2);
      g.gain.setValueAtTime(0, ini);
      g.gain.linearRampToValueAtTime(vol * a, ini + .015);
      g.gain.setTargetAtTime(0, ini + .02, (fin - ini) / (3 + h));
      o.connect(g).connect(mezcla); o.start(ini); o.stop(fin + .3);
    });
  }
  let t = .05; const comp1 = t + BEAT;
  melodia.forEach(([n, d]) => { nota(n, t, d * BEAT, .32); t += d * BEAT; });
  acordes.forEach((ch, k) => {
    const c0 = comp1 + k * 3 * BEAT;
    nota(ch[0], c0, BEAT * 1.5, .16);
    [1, 2].forEach(i => ch.forEach(n => nota(n + 12, c0 + i * BEAT, BEAT * .7, .05)));
  });
  return oc.startRendering ? new Promise(ok => { oc.oncomplete = e => ok(e.renderedBuffer); oc.startRendering(); }) : null;
}

const audio = new Audio(); audio.loop = true; audio.preload = 'auto';
audio.setAttribute('playsinline', ''); audio.volume = 1;
let sonando = false;
const btn = document.getElementById('musica');
function musicaOn() { const p = audio.play(); sonando = true; btn.classList.remove('off'); return p; }
function musicaOff() { audio.pause(); sonando = false; btn.classList.add('off'); }
btn.onclick = () => sonando ? musicaOff() : musicaOn();
// Pausa al salir de la página o cambiar de app; reanuda al volver
let pausadaPorSalir = false;
function alSalir() { if (sonando) { musicaOff(); pausadaPorSalir = true; } }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) alSalir();
  else if (pausadaPorSalir) { pausadaPorSalir = false; musicaOn(); }
});
addEventListener('pagehide', alSalir);

// ---------- Mini juego de fútbol (física 2.5D: avance, altura, efecto y rebotes) ----------
(() => {
  const cancha = document.getElementById('cancha'), balon = document.getElementById('balon'), sombra = document.getElementById('sombra');
  const portero = document.getElementById('portero'), porteria = document.getElementById('porteria'), aviso = document.getElementById('aviso');
  const R = 27, G = 1100, LARGUERO = 74;
  let W, Y0, D, b = null, arrastre = null, jugando = false, ultimo;

  function medir() {
    const c = cancha.getBoundingClientRect(), p = porteria.getBoundingClientRect();
    W = c.width; Y0 = c.height - 34 - R; D = Y0 - (p.bottom - c.top);
    return { c, p };
  }
  function dibujar(x, d, h) {
    const s = 1 - .45 * Math.min(d, D + 40) / D, y = Y0 - d - h * s;
    balon.style.transform = `translate(${x - R}px, ${y - R}px) scale(${s}) rotate(${(b ? b.giro : 0)}deg)`;
    sombra.style.transform = `translate(${x - 25}px, ${Y0 - d + R * s - 9}px) scale(${s * Math.max(.5, 1 - h / 400)})`;
    sombra.style.opacity = Math.max(.25, 1 - h / 300);
  }
  function colocar() { medir(); b = null; dibujar(W / 2, 0, 0); }
  colocar(); addEventListener('resize', () => { if (!jugando) colocar(); });

  function mensaje(txt) { aviso.textContent = txt; aviso.classList.remove('ver'); void aviso.offsetWidth; aviso.classList.add('ver'); }

  balon.addEventListener('pointerdown', e => {
    if (jugando) return; balon.setPointerCapture(e.pointerId); medir();
    arrastre = { x0: e.clientX, y0: e.clientY, pts: [[e.clientX, e.clientY, performance.now()]] };
  });
  balon.addEventListener('pointermove', e => {
    if (!arrastre) return;
    dibujar(W / 2 + (e.clientX - arrastre.x0) * .25, Math.max(0, (arrastre.y0 - e.clientY) * .15), 0);
    arrastre.pts.push([e.clientX, e.clientY, performance.now()]); if (arrastre.pts.length > 8) arrastre.pts.shift();
  });
  balon.addEventListener('pointerup', e => {
    if (!arrastre) return;
    const pts = arrastre.pts, [x1, y1, t1] = pts[0], dt = Math.max(16, performance.now() - t1) / 1000;
    const svx = (e.clientX - x1) / dt, svy = (e.clientY - y1) / dt; arrastre = null;
    if (svy > -250) return colocar();                       // deslizamiento muy flojo
    const vel = Math.hypot(svx, svy);
    // Efecto: cuánto se curva el final del deslizamiento respecto al total
    const m = pts[Math.floor(pts.length / 2)], d1 = (m[0] - x1) / Math.min(-1, m[1] - y1), d2 = (e.clientX - m[0]) / Math.min(-1, e.clientY - m[1]);
    b = { x: W / 2, d: 0, h: 0, vd: Math.min(Math.max(-svy * .8, 540), 1000), vx: 0,
          vh: Math.min(Math.max(vel * .28, 120), 520), efecto: Math.max(-900, Math.min(900, (d2 - d1) * 500)),
          giro: 0, cruzo: false, gol: false, t: 0 };
    b.vx = (svx / -svy) * b.vd * .9;                       // apunta hacia donde se desliza
    jugando = true; ultimo = performance.now(); requestAnimationFrame(paso);
  });

  function paso(ahora) {
    const dt = Math.min(.033, (ahora - ultimo) / 1000); ultimo = ahora; b.t += dt;
    b.vx += b.efecto * dt * (b.h > 0 ? 1 : 0); b.x += b.vx * dt; b.d += b.vd * dt;
    b.vh -= G * dt; b.h += b.vh * dt; b.giro += (b.vd + Math.abs(b.vx)) * dt * 1.5;
    if (b.h < 0) { b.h = 0; b.vh = Math.abs(b.vh) > 120 ? -b.vh * .45 : 0; b.vd *= .9; b.vx *= .9; b.efecto *= .5; }
    if (b.x < R || b.x > W - R) { b.x = Math.max(R, Math.min(W - R, b.x)); b.vx *= -.5; }
    if (!b.cruzo && b.d >= D) revisar();
    if (b.gol && b.d > D + 34) { b.d = D + 34; b.vd = 0; b.vx *= .5; }   // la red frena el balón
    if (b.d < 0) { b.d = 0; b.vd = 0; }
    dibujar(b.x, b.d, b.h);
    const quieto = Math.abs(b.vd) < 15 && b.h === 0;
    if (b.t > 2.6 || (quieto && b.t > .8) || b.d > D + 160) { jugando = false; return setTimeout(volver, 500); }
    requestAnimationFrame(paso);
  }
  function revisar() {
    b.cruzo = true;
    const { c, p } = medir(), g = portero.getBoundingClientRect();
    const izq = p.left - c.left + 6, der = p.right - c.left - 6, s = .55, alto = b.h * s;
    const gx1 = g.left - c.left, gx2 = g.right - c.left;
    const enPoste = (Math.abs(b.x - izq) < R * s || Math.abs(b.x - der) < R * s) && alto < LARGUERO;
    if (enPoste || (Math.abs(alto - LARGUERO) < R * s && b.x > izq && b.x < der)) {        // poste o larguero
      b.vd = -b.vd * .45; b.vx = (b.x < (izq + der) / 2 ? -1 : 1) * 120; b.vh = 180;
    } else if (b.x > izq && b.x < der && alto < LARGUERO) {
      if (b.x > gx1 - 10 && b.x < gx2 + 10 && alto < 60) {                                  // atajada
        b.vd = -b.vd * .35; b.vx += (b.x - (gx1 + gx2) / 2) * 6; b.vh = 220;
      } else {
        b.gol = true; b.vd *= .35; b.vx *= .3; b.efecto = 0; mensaje('¡GOOOL!');
        porteria.classList.remove('red'); void porteria.offsetWidth; porteria.classList.add('red');
        const bx = c.left + b.x, by = p.top + 30;
        fuego(bx, by); fuego(p.left + 20, p.top + 10); fuego(p.right - 20, p.top + 10); confeti(40);
        if (navigator.vibrate) navigator.vibrate([80, 50, 120]);
      }
    }
  }
  function volver() {
    const desde = { ...b }, ini = performance.now();
    (function anim(t) {
      const k = Math.min((t - ini) / 450, 1), e = k * (2 - k);
      dibujar(desde.x + (W / 2 - desde.x) * e, desde.d * (1 - e), Math.sin(k * Math.PI) * 40);
      if (k < 1) requestAnimationFrame(anim); else colocar();
    })(ini);
  }
})();

// ---------- Arranque ----------
let empezado = false;
function celebrar() {
  if (empezado) return; empezado = true;
  document.getElementById('inicio').classList.add('oculto');
  mostrar(); confeti(110); destellos(26);
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  let k = 0; const show = setInterval(() => { fuego(rnd(W * .15, W * .85), rnd(H * .12, H * .45)); if (++k > 6) clearInterval(show); }, 380);
  setInterval(() => fuego(rnd(W * .15, W * .85), rnd(H * .1, H * .4)), 2800);
}
const verSobre = () => document.getElementById('inicio').classList.add('visible');
generarCancion().then(b => {
  audio.src = URL.createObjectURL(wav(b));
  // Intenta sonar sola; si el teléfono lo bloquea, muestra el sobre
  const p = musicaOn();
  if (p && p.then) p.then(celebrar, () => { musicaOff(); verSobre(); }); else celebrar();
}).catch(verSobre);
document.getElementById('abrir').onclick = () => { musicaOn(); celebrar(); };
</script>
</body>
</html>
