<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff6ea">
<title>¡Feliz Cumpleaños, Cuñado!</title>
<style>
  :root {
    --crema: #fff6ea; --durazno: #ffd9b3; --naranja: #f2771a; --naranja2: #ff9f43;
    --cafe: #4a2611; --verde: #2a9d8f; --blanco: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.7), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(42,157,143,.18), transparent 45%),
      linear-gradient(170deg, var(--crema), var(--durazno) 55%, #ffb27a);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--crema);
    color: var(--cafe); text-align: center; overflow-x: hidden;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  /* Pantalla de inicio (necesaria para que suene la música en iOS/Android) */
  #inicio {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px; padding: 24px;
    background: linear-gradient(170deg, var(--crema), var(--durazno));
    transition: opacity .6s, transform .6s;
  }
  #inicio.oculto { opacity: 0; transform: scale(1.1); pointer-events: none; }
  #inicio p { font-size: 18px; font-weight: 600; }
  .regalo { font-size: 96px; animation: salto 1.2s infinite; filter: drop-shadow(0 10px 12px rgba(74,38,17,.25)); }
  .boton {
    border: 0; border-radius: 999px; padding: 16px 32px; font-size: 18px; font-weight: 700;
    color: var(--blanco); background: linear-gradient(135deg, var(--naranja2), var(--naranja));
    box-shadow: 0 8px 22px rgba(242,119,26,.45); animation: pulso 1.8s infinite;
  }
  .boton:active { transform: scale(.96); }

  main { max-width: 480px; margin: 0 auto; padding: 36px 0 104px; position: relative; z-index: 1; }
  h1 {
    font-size: clamp(38px, 12vw, 62px); line-height: 1.05; font-weight: 900;
    color: var(--naranja); text-shadow: 0 3px 0 var(--blanco), 0 6px 14px rgba(242,119,26,.3);
  }
  .sub { font-size: clamp(18px, 5.5vw, 24px); margin: 14px 0 30px; }
  .sub b {
    background: var(--verde); color: var(--blanco); padding: 2px 10px; border-radius: 8px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }

  /* Fotos estilo polaroid: el fondo blanco se funde con el GIF */
  .polaroid {
    background: var(--blanco); border-radius: 18px; padding: 12px 12px 16px;
    margin: 0 auto 28px; width: min(100%, 340px);
    box-shadow: 0 14px 30px rgba(74,38,17,.18), 0 2px 6px rgba(74,38,17,.08);
    transform: rotate(var(--giro)); animation: flotar 4s ease-in-out infinite;
  }
  .polaroid img { width: 100%; display: block; border-radius: 12px; object-fit: cover; }
  .foto { --giro: -2.5deg; }
  .foto img { aspect-ratio: 4 / 5; object-position: center 35%; }
  .gif { --giro: 2.5deg; animation-delay: -2s; }
  .gif img { aspect-ratio: 1 / 1; object-fit: contain; }
  .polaroid p { padding-top: 12px; font-size: 16px; font-weight: 600; }

  .mensaje {
    font-size: 17px; line-height: 1.6; padding: 18px 20px; margin: 4px 0 22px;
    background: rgba(255,255,255,.6); border-radius: 18px;
  }
  .velas { font-size: 38px; letter-spacing: 6px; }

  #musica {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6;
    width: 56px; height: 56px; border-radius: 50%; border: 0; font-size: 24px;
    background: var(--blanco); box-shadow: 0 6px 18px rgba(74,38,17,.25);
  }
  .palabra { display: inline-block; white-space: nowrap; }
  .letra { display: inline-block; animation: ola 1.6s ease-in-out infinite; }

  @keyframes flotar { 50% { transform: rotate(var(--giro)) translateY(-8px); } }
  @keyframes salto { 50% { transform: translateY(-16px) rotate(-6deg); } }
  @keyframes ola { 50% { transform: translateY(-6px); } }
  @keyframes pulso { 50% { box-shadow: 0 8px 30px rgba(242,119,26,.75); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<div id="inicio">
  <div class="regalo">🎁</div>
  <p>Tienes una sorpresa 🐾</p>
  <button class="boton" id="abrir">Toca para abrir tu sorpresa</button>
</div>

<canvas id="fx"></canvas>

<main>
  <h1 id="titulo">¡Feliz Cumpleaños!</h1>
  <p class="sub">Para el <b>mejor cuñado del mundo</b> 🎉</p>

  <div class="polaroid foto">
    <img src="img/gatito.jpg" alt="Gatito lindo"
         >
    <p>Este gatito también te desea un gran día 🐱</p>
  </div>

  <div class="polaroid gif">
    <img src="gif/cumple.gif" alt="GIF de cumpleaños"
         >
    <p>¡A bailar que es tu día! 🕺</p>
  </div>

  <p class="mensaje">
    Que este año te traiga salud, risas, buena comida y muchas aventuras.
    ¡Gracias por ser parte de la familia! 🥳
  </p>
  <div class="velas">🎂🎈🎊🎈🎂</div>
</main>

<button id="musica" aria-label="Música">🔊</button>

<script>
// Título con letras que hacen "ola"
const t = document.getElementById('titulo');
let i = 0;
t.innerHTML = t.textContent.split(' ').map(w => '<span class="palabra">' + [...w].map(c =>
  `<span class="letra" style="animation-delay:${i++ * 0.08}s">${c}</span>`).join('') + '</span>').join(' ');

// ---------- Confeti y fuegos artificiales ----------
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
function ajustar() { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
ajustar(); addEventListener('resize', ajustar);

const colores = ['#f2771a', '#ff9f43', '#2a9d8f', '#ffd166', '#ffffff', '#e76f51'];
const parts = [];
const rnd = (a, b) => a + Math.random() * (b - a);

function confeti(n) {
  for (let i = 0; i < n; i++) parts.push({
    x: rnd(0, W), y: rnd(-H, 0), vx: rnd(-1, 1), vy: rnd(2, 4), r: rnd(0, 6.28), vr: rnd(-.2, .2),
    w: rnd(6, 10), h: rnd(10, 16), c: colores[i % colores.length], tipo: 'c', vida: 999
  });
}
function fuego(x, y) {
  const c = colores[Math.floor(rnd(0, colores.length))];
  for (let i = 0; i < 50; i++) {
    const a = rnd(0, 6.28), v = rnd(1, 5);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c, tipo: 'f', vida: 60 });
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    if (p.tipo === 'c') {
      p.x += p.vx + Math.sin(p.y / 40); p.y += p.vy; p.r += p.vr;
      if (p.y > H + 20) { p.y = -20; p.x = rnd(0, W); }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.r * 2));
      ctx.restore();
    } else {
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .98; p.vida--;
      if (p.vida <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = p.vida / 60; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(loop);
}
loop();

// Toca la pantalla = fuegos artificiales
addEventListener('pointerdown', e => { if (!e.target.closest('button')) fuego(e.clientX, e.clientY); });

// ---------- Música: "Cumpleaños feliz" generada en el navegador ----------
let ac, sonando = false, timer;
const N = { G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784 };
const melodia = [
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
  ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
  ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
  ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]
];
function nota(f, ini, dur) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, ini);
  g.gain.linearRampToValueAtTime(.25, ini + .03);
  g.gain.exponentialRampToValueAtTime(.001, ini + dur * .95);
  o.connect(g).connect(ac.destination); o.start(ini); o.stop(ini + dur);
}
function tocar() {
  const pulso = .45; let t = ac.currentTime + .1;
  melodia.forEach(([n, d]) => { nota(N[n], t, d * pulso); nota(N[n] / 2, t, d * pulso); t += d * pulso; });
  timer = setTimeout(() => { if (sonando) tocar(); }, (t - ac.currentTime + 1) * 1000);
}
function musicaOn() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  ac.resume(); sonando = true; tocar();
  document.getElementById('musica').textContent = '🔊';
}
function musicaOff() {
  sonando = false; clearTimeout(timer); ac && ac.suspend();
  document.getElementById('musica').textContent = '🔇';
}
document.getElementById('musica').onclick = () => {
  if (sonando) { musicaOff(); } else { ac && ac.close(); ac = null; musicaOn(); }
};

// Abrir sorpresa
document.getElementById('abrir').onclick = () => {
  document.getElementById('inicio').classList.add('oculto');
  musicaOn(); confeti(120);
  if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
  let k = 0; const show = setInterval(() => {
    fuego(rnd(W * .15, W * .85), rnd(H * .1, H * .45));
    if (++k > 6) clearInterval(show);
  }, 350);
  setInterval(() => fuego(rnd(W * .15, W * .85), rnd(H * .1, H * .4)), 2500);
};
</script>
</body>
</html>
